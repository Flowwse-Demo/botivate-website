<svg id="zoff-svg" xmlns="http://www.w3.org/2000/svg" viewBox="-0 -0 350 140" width="350" height="140" class="overflow-visible">
                <!-- Outer styling/font loads inside SVG for self-containment -->
                <defs>
                  <style>
                    .zoff-text {
                      font-family: 'Fredoka', 'Arial Rounded MT Bold', sans-serif;
                      font-weight: 700;
                      font-size: 85px;
                      letter-spacing: -2px;
                    }
                    .zoff-tagline {
                      font-family: 'Montserrat', sans-serif;
                      font-weight: 600;
                      font-size: 15px;
                      letter-spacing: 4px;
                    }
                  </style>
                </defs>
                
                <!-- Main Logo Group -->
                <g id="logo-content">
                  <!-- Custom "ZOFF" Text Layout to ensure precise heart centering in the O -->
                  <text x="10" y="85" fill="#1e293b" class="zoff-text" id="logo-txt-z">Z</text>
                  
                  <!-- Custom "O" design with integrated Heart -->
                  <g transform="translate(68, 10)">
                    <circle cx="42" cy="50" r="32" fill="#1e293b" id="logo-circle-o"/>
                    <!-- Perfectly scaled centered heart -->
                    <path d="M 42,61 C 37.5,56 26.5,49 26.5,39 C 26.5,32.5 32,28.5 37.5,28.5 C 40.5,28.5 42,31 42,31 C 42,31 43.5,28.5 46.5,28.5 C 52,28.5 57.5,32.5 57.5,39 C 57.5,49 46.5,56 42,61 Z" fill="#ef4444" id="logo-heart"/>
                  </g>
                  
                  <text x="160" y="85" fill="#1e293b" class="zoff-text" id="logo-txt-ff">FF</text>
                  
                  <!-- Clean, wide-spaced tagline below -->
                  <text x="175" y="122" text-anchor="middle" fill="#64748b" class="zoff-tagline" id="logo-tagline">ZONE OF FRESH FOOD</text>
                </g>
              </svg>